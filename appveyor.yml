# See https://github.com/japaric/trust/blob/master/appveyor.yml

environment:
  global:
    RUST_VERSION: stable
    CRATE_NAME: windows-clipboard
    CARGO_PROFILE_RELEASE_LTO: 'true'

  matrix:
    # MSVC
    - TARGET: i686-pc-windows-gnu
    - TARGET: x86_64-pc-windows-gnu

install:
  - curl -sSf -o rustup-init.exe https://win.rustup.rs/
  - rustup-init.exe -y --default-host %TARGET% --default-toolchain %RUST_VERSION%
  - set PATH=%PATH%;C:\Users\appveyor\.cargo\bin
  - rustc -Vv
  - cargo -V

test_script:
  # we don't run the "test phase" when doing deploys
  - if [%APPVEYOR_REPO_TAG%]==[false] (
    cargo build --target %TARGET% --release &&
    test.bat
    )

before_deploy:
  - cargo rustc --target %TARGET% --release --bin clipboard
  - test.bat
  - ps: ci\before_deploy.ps1

deploy:
  - provider: GitHub
    artifact: /.*\.zip/
    auth_token:
      secure: GAVemcwm7SV2HtEFhLf2u2jz+aXtgy0dxS0nwFQYMMYicEBmhJKXdimRrR0S1/JmN9JYgVAZlor+3qvFAZn8kzSTgSxfJi/lUKLZuvQZcHwt6YkUiwcTmFHbb6I0Hxce
    repository: Jolg42/windows-clipboard
    draft: true
    force_update: true
    on:
      RUST_VERSION: stable
      appveyor_repo_tag: true

# Building is done in the test phase, so we disable Appveyor's build phase.
build: false
